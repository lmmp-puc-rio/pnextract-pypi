name: Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pnextract
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2
    - name: Build package
      run: uv build
    - name: Publish package
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: uv publish
